services:
  todo-app:
    build: .
    container_name: todo-app
    restart: unless-stopped
    ports:
      - "8238:8238"
    environment:
      HOST: 0.0.0.0
      PORT: 8238
      TODO_DATA_DIR: /data
      TODO_NOTES_DIR: /data/notes
      TODO_BACKUP_DIR: /data/backups
      TODO_CONFIG_DIR: /config
    volumes:
      - ./data:/data
      - ./config:/config
