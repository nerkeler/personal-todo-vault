services:
  todo-app:
    image: nerkeler/todo-app:latest
    container_name: todo-app
    restart: unless-stopped
    ports:
      - "8238:8238"
    environment:
      HOST: 0.0.0.0
      PORT: 8238
      TZ: Asia/Shanghai
      TODO_DATA_DIR: /data
      TODO_NOTES_DIR: /data/notes
      TODO_BACKUP_DIR: /data/backups
      TODO_CONFIG_DIR: /config
    volumes:
      - ./data:/data
      - ./config:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8238/api/todos').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
